<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#FBF3DC"/>
  <!-- Body -->
  <ellipse cx="60" cy="78" rx="36" ry="30" fill="#E8C06A"/>
  <!-- Belly -->
  <ellipse cx="60" cy="86" rx="20" ry="16" fill="#FDF8E8"/>
  <!-- Belly pattern -->
  <path d="M52 82 L60 86 L68 82" stroke="#E2C87A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M54 88 L60 92 L66 88" stroke="#E2C87A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="60" cy="48" rx="32" ry="28" fill="#E8C06A"/>
  <!-- Ear tufts -->
  <path d="M34 34 L28 16 L44 32" fill="#C4903A"/>
  <path d="M86 34 L92 16 L76 32" fill="#C4903A"/>
  <!-- Eye sockets -->
  <circle cx="46" cy="48" r="14" fill="#FBF3DC"/>
  <circle cx="74" cy="48" r="14" fill="#FBF3DC"/>
  <!-- Eye borders -->
  <circle cx="46" cy="48" r="14" stroke="#C4903A" stroke-width="2" fill="none"/>
  <circle cx="74" cy="48" r="14" stroke="#C4903A" stroke-width="2" fill="none"/>
  <!-- Irises -->
  <circle cx="47" cy="47" r="8" fill="#72482D"/>
  <circle cx="75" cy="47" r="8" fill="#72482D"/>
  <!-- Pupils -->
  <circle cx="48" cy="45" r="5" fill="#3D2415"/>
  <circle cx="76" cy="45" r="5" fill="#3D2415"/>
  <!-- Highlights -->
  <circle cx="50" cy="43" r="2.5" fill="white"/>
  <circle cx="78" cy="43" r="2.5" fill="white"/>
  <!-- Beak -->
  <path d="M55 56 L60 66 L65 56" fill="#F6A623"/>
  <path d="M55 56 L60 61 L65 56" fill="#F8BD4F"/>
  <!-- Blush -->
  <ellipse cx="36" cy="56" rx="6" ry="4" fill="#F5C78E" opacity="0.5"/>
  <ellipse cx="84" cy="56" rx="6" ry="4" fill="#F5C78E" opacity="0.5"/>
</svg>
