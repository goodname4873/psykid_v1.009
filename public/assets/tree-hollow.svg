<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 185" fill="none">
  <defs>
    <linearGradient id="bark" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#C0A07A"/>
      <stop offset="35%" stop-color="#A68660"/>
      <stop offset="65%" stop-color="#8E7050"/>
      <stop offset="100%" stop-color="#7A5E3E"/>
    </linearGradient>
    <linearGradient id="barkDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4E30"/>
      <stop offset="100%" stop-color="#5C4028"/>
    </linearGradient>
    <radialGradient id="hollow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3E2818"/>
      <stop offset="60%" stop-color="#2E1C10"/>
      <stop offset="100%" stop-color="#1E100A"/>
    </radialGradient>
  </defs>

  <!-- Dark hollow background (visible through the hole) -->
  <ellipse cx="100" cy="82" rx="47" ry="44" fill="url(#hollow)"/>

  <!-- Tree stump body with hole cut out (evenodd makes the inner circle transparent) -->
  <path fill-rule="evenodd" d="
    M38 8
    C32 8, 28 10, 26 14
    L26 14 C24 18, 24 22, 26 26
    C20 28, 14 40, 12 60
    C10 80, 8 105, 10 130
    C12 148, 16 158, 22 164
    C24 168, 18 170, 8 174
    C4 176, 2 180, 6 182
    C10 185, 30 185, 50 183
    C70 181, 80 178, 100 178
    C120 178, 130 181, 150 183
    C170 185, 190 185, 194 182
    C198 180, 196 176, 192 174
    C182 170, 176 168, 178 164
    C184 158, 188 148, 190 130
    C192 105, 190 80, 188 60
    C186 40, 180 28, 174 26
    C176 22, 176 18, 174 14
    C172 10, 168 8, 162 8
    C148 6, 130 4, 100 4
    C70 4, 52 6, 38 8
    Z
    M100 82
    m-46 0
    a46 43 0 1 0 92 0
    a46 43 0 1 0 -92 0
    Z
  " fill="url(#bark)"/>

  <!-- Left side shadow -->
  <path d="
    M38 8 C32 8, 28 10, 26 14 C24 18, 24 22, 26 26
    C20 28, 14 40, 12 60 C10 80, 8 105, 10 130
    C12 148, 16 158, 22 164 C20 150, 18 120, 20 90
    C22 60, 30 30, 38 8 Z
  " fill="#5C4028" opacity="0.25"/>

  <!-- Right side shadow -->
  <path d="
    M162 8 C168 8, 172 10, 174 14 C176 18, 176 22, 174 26
    C180 28, 186 40, 188 60 C190 80, 192 105, 190 130
    C188 148, 184 158, 178 164 C180 150, 182 120, 180 90
    C178 60, 170 30, 162 8 Z
  " fill="#5C4028" opacity="0.2"/>

  <!-- Center highlight -->
  <path d="
    M85 10 Q100 8 115 10
    Q112 50 112 130
    Q100 135 88 130
    Q88 50 85 10 Z
  " fill="#D0B88A" opacity="0.15"/>

  <!-- Bark groove lines -->
  <path d="M55 16 Q52 60 56 120 Q58 150 60 170" stroke="#6B4E30" stroke-width="1.8" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M145 16 Q148 60 144 120 Q142 150 140 170" stroke="#6B4E30" stroke-width="1.8" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M70 8 Q68 30 70 38" stroke="#6B4E30" stroke-width="1.2" fill="none" opacity="0.18" stroke-linecap="round"/>
  <path d="M130 8 Q132 30 130 38" stroke="#6B4E30" stroke-width="1.2" fill="none" opacity="0.18" stroke-linecap="round"/>
  <path d="M30 130 Q28 150 24 165" stroke="#6B4E30" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M170 130 Q172 150 176 165" stroke="#6B4E30" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>

  <!-- Wood rim around the hollow (inner ring) -->
  <ellipse cx="100" cy="82" rx="48" ry="45" fill="none" stroke="#7A5E3E" stroke-width="4"/>
  <ellipse cx="100" cy="82" rx="46" ry="43" fill="none" stroke="#5C4028" stroke-width="1.5" opacity="0.4"/>

  <!-- Rim highlight (top arc) -->
  <path d="M60 68 Q80 52 100 50 Q120 52 140 68" stroke="#C0A07A" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Top surface (cut rings) -->
  <ellipse cx="100" cy="10" rx="64" ry="8" fill="#C0A07A" opacity="0.5"/>
  <ellipse cx="100" cy="10" rx="64" ry="8" fill="none" stroke="#A68660" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="100" cy="10" rx="50" ry="6" fill="none" stroke="#A68660" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="100" cy="10" rx="35" ry="4" fill="none" stroke="#A68660" stroke-width="0.8" opacity="0.25"/>

  <!-- Moss patches -->
  <ellipse cx="14" cy="120" rx="8" ry="14" fill="#7BAF4C" opacity="0.6"/>
  <ellipse cx="10" cy="128" rx="6" ry="10" fill="#8BC060" opacity="0.5"/>
  <ellipse cx="186" cy="120" rx="8" ry="14" fill="#7BAF4C" opacity="0.6"/>
  <ellipse cx="190" cy="128" rx="6" ry="10" fill="#8BC060" opacity="0.5"/>
</svg>
