<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="72" ry="68" fill="#D4A24E"/>
  <ellipse cx="100" cy="122" rx="62" ry="58" fill="#E8C06A"/>
  <!-- Belly -->
  <ellipse cx="100" cy="138" rx="38" ry="32" fill="#FBF3DC"/>
  <ellipse cx="100" cy="140" rx="30" ry="24" fill="#FDF8E8"/>
  <!-- Belly pattern (chevrons) -->
  <path d="M88 128 L100 134 L112 128" stroke="#E2C87A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M86 136 L100 142 L114 136" stroke="#E2C87A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M88 144 L100 150 L112 144" stroke="#E2C87A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="100" cy="78" rx="56" ry="50" fill="#D4A24E"/>
  <ellipse cx="100" cy="80" rx="50" ry="44" fill="#E8C06A"/>
  <!-- Ear tufts -->
  <path d="M56 52 L48 24 L72 48" fill="#D4A24E"/>
  <path d="M60 52 L54 30 L72 50" fill="#C4903A"/>
  <path d="M144 52 L152 24 L128 48" fill="#D4A24E"/>
  <path d="M140 52 L146 30 L128 50" fill="#C4903A"/>
  <!-- Eye sockets -->
  <circle cx="76" cy="78" r="24" fill="#FBF3DC"/>
  <circle cx="124" cy="78" r="24" fill="#FBF3DC"/>
  <!-- Eye borders -->
  <circle cx="76" cy="78" r="24" stroke="#C4903A" stroke-width="2.5" fill="none"/>
  <circle cx="124" cy="78" r="24" stroke="#C4903A" stroke-width="2.5" fill="none"/>
  <!-- Irises -->
  <circle cx="78" cy="76" r="14" fill="#72482D"/>
  <circle cx="126" cy="76" r="14" fill="#72482D"/>
  <!-- Pupils -->
  <circle cx="80" cy="74" r="8" fill="#3D2415"/>
  <circle cx="128" cy="74" r="8" fill="#3D2415"/>
  <!-- Eye highlights -->
  <circle cx="83" cy="71" r="4" fill="white"/>
  <circle cx="131" cy="71" r="4" fill="white"/>
  <circle cx="77" cy="78" r="2" fill="white" opacity="0.6"/>
  <circle cx="125" cy="78" r="2" fill="white" opacity="0.6"/>
  <!-- Beak -->
  <path d="M92 92 L100 108 L108 92" fill="#F6A623"/>
  <path d="M92 92 L100 100 L108 92" fill="#F8BD4F"/>
  <!-- Beak line -->
  <line x1="94" y1="96" x2="106" y2="96" stroke="#E8941E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyebrows (friendly expression) -->
  <path d="M58 60 Q68 54 88 58" stroke="#C4903A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M142 60 Q132 54 112 58" stroke="#C4903A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Wings -->
  <path d="M28 110 Q22 130 34 155 Q44 165 50 158 Q42 140 40 120 Q38 108 34 106 Z" fill="#C4903A"/>
  <path d="M30 114 Q26 132 36 152 Q42 156 44 152 Q38 138 36 122 Z" fill="#D4A24E"/>
  <path d="M172 110 Q178 130 166 155 Q156 165 150 158 Q158 140 160 120 Q162 108 166 106 Z" fill="#C4903A"/>
  <path d="M170 114 Q174 132 164 152 Q158 156 156 152 Q162 138 164 122 Z" fill="#D4A24E"/>
  <!-- Feet -->
  <path d="M78 182 L72 194 L80 190 L76 198 L84 192 L82 198 L88 188 Z" fill="#F6A623"/>
  <path d="M122 182 L128 194 L120 190 L124 198 L116 192 L118 198 L112 188 Z" fill="#F6A623"/>
  <!-- Cheeks (blush) -->
  <ellipse cx="56" cy="92" rx="10" ry="7" fill="#F5C78E" opacity="0.5"/>
  <ellipse cx="144" cy="92" rx="10" ry="7" fill="#F5C78E" opacity="0.5"/>
  <!-- Forehead spot -->
  <circle cx="100" cy="58" r="5" fill="#C4903A" opacity="0.4"/>
</svg>
